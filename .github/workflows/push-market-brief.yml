name: Market Brief — Daily Push
# Requires one repo secret: MARKET_BRIEF_WEBHOOK_URL (TRMNL)

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC, Mon-Fri — after US market close (4:00pm ET)
    - cron: '30 21 * * 1-5'

jobs:
  push-market-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch market quotes
        id: quotes
        run: |
          set +e

          fetch_quote() {
            local symbol="$1"
            local prefix="$2"
            local response price prev change dir week_prev week_change week_dir

            response=$(curl -s -H "User-Agent: Mozilla/5.0" \
              "https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=5d")
            price=$(echo "$response" | jq -r '.chart.result[0].meta.regularMarketPrice // empty' 2>/dev/null)
            prev=$(echo "$response" | jq -r '.chart.result[0].meta.chartPreviousClose // empty' 2>/dev/null)
            week_prev=$(echo "$response" | jq -r '[.chart.result[0].indicators.quote[0].close[]? ] | map(select(. != null)) | .[0] // empty' 2>/dev/null)

            if [ -z "$price" ] || [ -z "$prev" ]; then
              echo "::warning::Failed to fetch $symbol quote — using fallback values"
              price="N/A"
              change="0.00"
              dir="flat"
              week_change="0.00"
              week_dir="flat"
            else
              change=$(awk -v p="$price" -v prev="$prev" 'BEGIN{printf "%+.2f", ((p-prev)/prev)*100}')
              dir=$(awk -v p="$price" -v prev="$prev" 'BEGIN{ if (p>prev) print "up"; else if (p<prev) print "down"; else print "flat" }')

              if [ -z "$week_prev" ]; then
                week_change="0.00"
                week_dir="flat"
              else
                week_change=$(awk -v p="$price" -v prev="$week_prev" 'BEGIN{printf "%+.2f", ((p-prev)/prev)*100}')
                week_dir=$(awk -v p="$price" -v prev="$week_prev" 'BEGIN{ if (p>prev) print "up"; else if (p<prev) print "down"; else print "flat" }')
              fi
            fi

            echo "${prefix}_price=$price" >> "$GITHUB_OUTPUT"
            echo "${prefix}_change=$change" >> "$GITHUB_OUTPUT"
            echo "${prefix}_dir=$dir" >> "$GITHUB_OUTPUT"
            echo "${prefix}_week_change=$week_change" >> "$GITHUB_OUTPUT"
            echo "${prefix}_week_dir=$week_dir" >> "$GITHUB_OUTPUT"
          }

          fetch_quote "%5EGSPC" "sp500"
          fetch_quote "%5EDJI" "dow"
          fetch_quote "%5EIXIC" "nasdaq"
          fetch_quote "JPM" "jpm"

      - name: Fetch trending tickers
        id: trending
        run: |
          set +e
          RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" \
            "https://query1.finance.yahoo.com/v1/finance/trending/US?count=5")
          TICKERS=$(echo "$RESPONSE" | jq -c '[.finance.result[0].quotes[]?.symbol] // []' 2>/dev/null)

          if [ -z "$TICKERS" ] || [ "$TICKERS" = "null" ]; then
            echo "::warning::Failed to fetch trending tickers — using empty list"
            TICKERS="[]"
          fi

          MOVERS="[]"
          if [ "$TICKERS" != "[]" ]; then
            MOVER_LIST=()
            for symbol in $(echo "$TICKERS" | jq -r '.[]'); do
              QRESP=$(curl -s -H "User-Agent: Mozilla/5.0" \
                "https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d")
              QPRICE=$(echo "$QRESP" | jq -r '.chart.result[0].meta.regularMarketPrice // empty' 2>/dev/null)
              QPREV=$(echo "$QRESP" | jq -r '.chart.result[0].meta.chartPreviousClose // empty' 2>/dev/null)
              if [ -n "$QPRICE" ] && [ -n "$QPREV" ]; then
                QCHANGE=$(awk -v p="$QPRICE" -v prev="$QPREV" 'BEGIN{printf "%+.1f", ((p-prev)/prev)*100}')
                MOVER_LIST+=("${symbol} ${QCHANGE}%")
              else
                MOVER_LIST+=("${symbol}")
              fi
            done
            MOVERS=$(printf '%s\n' "${MOVER_LIST[@]}" | jq -R . | jq -cs .)
          fi

          echo "tickers<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MOVERS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fetch market news headlines
        id: news
        run: |
          python3 <<'PY' > headlines.json
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          feeds = [
              "https://feeds.marketwatch.com/marketwatch/topstories/",
              "https://finance.yahoo.com/news/rssindex",
              "https://www.cnbc.com/id/20910258/device/rss/rss.html",
          ]

          headlines = []
          for url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = resp.read()
                  root = ET.fromstring(data)
                  for item in root.iter("item"):
                      title_el = item.find("title")
                      if title_el is not None and title_el.text:
                          title = title_el.text.strip()
                          if title and title not in headlines:
                              headlines.append(title)
              except Exception:
                  continue

          print(json.dumps(headlines[:10]))
          PY

          echo "headlines<<EOF" >> "$GITHUB_OUTPUT"
          cat headlines.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Pick reason + brief from real headlines
        id: reason
        env:
          HEADLINES: ${{ steps.news.outputs.headlines }}
        run: |
          set +e
          BRIEF=$(echo "$HEADLINES" | jq -r '.[0] // empty')
          WHY1=$(echo "$HEADLINES" | jq -r '.[1] // empty')
          WHY2=$(echo "$HEADLINES" | jq -r '.[2] // empty')
          WHY3=$(echo "$HEADLINES" | jq -r '.[3] // empty')
          WHY4=$(echo "$HEADLINES" | jq -r '.[4] // empty')

          if [ -z "$BRIEF" ]; then
            BRIEF="No headlines available today — check the Action logs."
          fi
          if [ -z "$WHY1" ]; then
            WHY1="Check the market for today's developments."
          fi

          echo "brief<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BRIEF" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "why1<<EOF" >> "$GITHUB_OUTPUT"
          echo "$WHY1" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "why2<<EOF" >> "$GITHUB_OUTPUT"
          echo "$WHY2" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "why3<<EOF" >> "$GITHUB_OUTPUT"
          echo "$WHY3" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "why4<<EOF" >> "$GITHUB_OUTPUT"
          echo "$WHY4" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Push to TRMNL
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.MARKET_BRIEF_WEBHOOK_URL }}
          SP_PRICE: ${{ steps.quotes.outputs.sp500_price }}
          SP_CHANGE: ${{ steps.quotes.outputs.sp500_change }}
          SP_DIR: ${{ steps.quotes.outputs.sp500_dir }}
          SP_WEEK_CHANGE: ${{ steps.quotes.outputs.sp500_week_change }}
          SP_WEEK_DIR: ${{ steps.quotes.outputs.sp500_week_dir }}
          DOW_PRICE: ${{ steps.quotes.outputs.dow_price }}
          DOW_CHANGE: ${{ steps.quotes.outputs.dow_change }}
          DOW_DIR: ${{ steps.quotes.outputs.dow_dir }}
          DOW_WEEK_CHANGE: ${{ steps.quotes.outputs.dow_week_change }}
          DOW_WEEK_DIR: ${{ steps.quotes.outputs.dow_week_dir }}
          NASDAQ_PRICE: ${{ steps.quotes.outputs.nasdaq_price }}
          NASDAQ_CHANGE: ${{ steps.quotes.outputs.nasdaq_change }}
          NASDAQ_DIR: ${{ steps.quotes.outputs.nasdaq_dir }}
          NASDAQ_WEEK_CHANGE: ${{ steps.quotes.outputs.nasdaq_week_change }}
          NASDAQ_WEEK_DIR: ${{ steps.quotes.outputs.nasdaq_week_dir }}
          JPM_PRICE: ${{ steps.quotes.outputs.jpm_price }}
          JPM_CHANGE: ${{ steps.quotes.outputs.jpm_change }}
          JPM_DIR: ${{ steps.quotes.outputs.jpm_dir }}
          JPM_WEEK_CHANGE: ${{ steps.quotes.outputs.jpm_week_change }}
          JPM_WEEK_DIR: ${{ steps.quotes.outputs.jpm_week_dir }}
          TRENDING: ${{ steps.trending.outputs.tickers }}
          BRIEF: ${{ steps.reason.outputs.brief }}
          WHY1: ${{ steps.reason.outputs.why1 }}
          WHY2: ${{ steps.reason.outputs.why2 }}
          WHY3: ${{ steps.reason.outputs.why3 }}
          WHY4: ${{ steps.reason.outputs.why4 }}
        run: |
          set +e
          DATE=$(date -u '+%b %d, %Y')
          TRENDING_TEXT=$(echo "$TRENDING" | jq -r 'if length > 0 then join(" · ") else "No standout movers today" end' 2>/dev/null)

          trend_line() {
            local name="$1" dir="$2" week_dir="$3"
            if [ "$dir" = "up" ] && [ "$week_dir" = "up" ]; then
              echo "📈 ${name} is climbing — up today and up this week."
            elif [ "$dir" = "up" ] && [ "$week_dir" = "down" ]; then
              echo "📈 ${name} bounced today after a down week."
            elif [ "$dir" = "down" ] && [ "$week_dir" = "up" ]; then
              echo "📉 ${name} dipped today despite a stronger week."
            elif [ "$dir" = "down" ] && [ "$week_dir" = "down" ]; then
              echo "📉 ${name} is sliding — down today and down this week."
            else
              echo "▪ ${name} is roughly flat today and this week."
            fi
          }

          SP_TREND=$(trend_line "S&P 500" "$SP_DIR" "$SP_WEEK_DIR")
          DOW_TREND=$(trend_line "Dow Jones" "$DOW_DIR" "$DOW_WEEK_DIR")
          NASDAQ_TREND=$(trend_line "Nasdaq" "$NASDAQ_DIR" "$NASDAQ_WEEK_DIR")
          JPM_TREND=$(trend_line "JPMorgan" "$JPM_DIR" "$JPM_WEEK_DIR")

          PAYLOAD=$(jq -n \
            --arg date "$DATE" \
            --arg brief "$BRIEF" \
            --arg why1 "$WHY1" \
            --arg why2 "$WHY2" \
            --arg why3 "$WHY3" \
            --arg why4 "$WHY4" \
            --arg trending "$TRENDING_TEXT" \
            --arg sp_trend "$SP_TREND" \
            --arg dow_trend "$DOW_TREND" \
            --arg nasdaq_trend "$NASDAQ_TREND" \
            --arg jpm_trend "$JPM_TREND" \
            --arg sp_price "$SP_PRICE" \
            --arg sp_change "$SP_CHANGE" \
            --arg sp_dir "$SP_DIR" \
            --arg sp_week_change "$SP_WEEK_CHANGE" \
            --arg sp_week_dir "$SP_WEEK_DIR" \
            --arg dow_price "$DOW_PRICE" \
            --arg dow_change "$DOW_CHANGE" \
            --arg dow_dir "$DOW_DIR" \
            --arg dow_week_change "$DOW_WEEK_CHANGE" \
            --arg dow_week_dir "$DOW_WEEK_DIR" \
            --arg nasdaq_price "$NASDAQ_PRICE" \
            --arg nasdaq_change "$NASDAQ_CHANGE" \
            --arg nasdaq_dir "$NASDAQ_DIR" \
            --arg nasdaq_week_change "$NASDAQ_WEEK_CHANGE" \
            --arg nasdaq_week_dir "$NASDAQ_WEEK_DIR" \
            --arg jpm_price "$JPM_PRICE" \
            --arg jpm_change "$JPM_CHANGE" \
            --arg jpm_dir "$JPM_DIR" \
            --arg jpm_week_change "$JPM_WEEK_CHANGE" \
            --arg jpm_week_dir "$JPM_WEEK_DIR" \
            '{merge_variables: {
              date: $date,
              brief: $brief,
              why1: $why1,
              why2: $why2,
              why3: $why3,
              why4: $why4,
              trending: $trending,
              sp_trend: $sp_trend,
              dow_trend: $dow_trend,
              nasdaq_trend: $nasdaq_trend,
              jpm_trend: $jpm_trend,
              market_index_name: "S&P 500",
              market_price: $sp_price,
              market_change_pct: $sp_change,
              market_direction: $sp_dir,
              market_week_change_pct: $sp_week_change,
              market_week_direction: $sp_week_dir,
              dow_price: $dow_price,
              dow_change_pct: $dow_change,
              dow_direction: $dow_dir,
              dow_week_change_pct: $dow_week_change,
              dow_week_direction: $dow_week_dir,
              nasdaq_price: $nasdaq_price,
              nasdaq_change_pct: $nasdaq_change,
              nasdaq_direction: $nasdaq_dir,
              nasdaq_week_change_pct: $nasdaq_week_change,
              nasdaq_week_direction: $nasdaq_week_dir,
              jpm_price: $jpm_price,
              jpm_change_pct: $jpm_change,
              jpm_direction: $jpm_dir,
              jpm_week_change_pct: $jpm_week_change,
              jpm_week_direction: $jpm_week_dir
            }}')

          HTTP_STATUS=$(curl -s -o /tmp/trmnl-response.txt -w "%{http_code}" -X POST "$TRMNL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          cat /tmp/trmnl-response.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::TRMNL webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Done! (HTTP $HTTP_STATUS)"
