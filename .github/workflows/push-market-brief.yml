name: Market Brief — Daily Push

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC, Mon-Fri — after US market close (4:00pm ET)
    - cron: '30 21 * * 1-5'

jobs:
  push-market-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    steps:
      - name: Fetch S&P 500 quote
        id: sp500
        run: |
          set +e
          RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" \
            "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=1d")
          PRICE=$(echo "$RESPONSE" | jq -r '.chart.result[0].meta.regularMarketPrice // empty' 2>/dev/null)
          PREV=$(echo "$RESPONSE" | jq -r '.chart.result[0].meta.chartPreviousClose // empty' 2>/dev/null)

          if [ -z "$PRICE" ] || [ -z "$PREV" ]; then
            echo "::warning::Failed to fetch S&P 500 quote — using fallback values"
            PRICE="N/A"
            CHANGE="0.00"
            DIR="flat"
          else
            CHANGE=$(awk -v p="$PRICE" -v prev="$PREV" 'BEGIN{printf "%+.2f", ((p-prev)/prev)*100}')
            DIR=$(awk -v p="$PRICE" -v prev="$PREV" 'BEGIN{ if (p>prev) print "up"; else if (p<prev) print "down"; else print "flat" }')
          fi

          echo "price=$PRICE" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "change=$CHANGE" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Fetch JPM quote
        id: jpm
        run: |
          set +e
          RESPONSE=$(curl -s -H "User-Agent: Mozilla/5.0" \
            "https://query1.finance.yahoo.com/v8/finance/chart/JPM?interval=1d&range=1d")
          PRICE=$(echo "$RESPONSE" | jq -r '.chart.result[0].meta.regularMarketPrice // empty' 2>/dev/null)
          PREV=$(echo "$RESPONSE" | jq -r '.chart.result[0].meta.chartPreviousClose // empty' 2>/dev/null)

          if [ -z "$PRICE" ] || [ -z "$PREV" ]; then
            echo "::warning::Failed to fetch JPM quote — using fallback values"
            PRICE="N/A"
            CHANGE="0.00"
            DIR="flat"
          else
            CHANGE=$(awk -v p="$PRICE" -v prev="$PREV" 'BEGIN{printf "%+.2f", ((p-prev)/prev)*100}')
            DIR=$(awk -v p="$PRICE" -v prev="$PREV" 'BEGIN{ if (p>prev) print "up"; else if (p<prev) print "down"; else print "flat" }')
          fi

          echo "price=$PRICE" >> "$GITHUB_OUTPUT"
          echo "change=$CHANGE" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Fetch market news headlines
        id: news
        run: |
          python3 <<'PY' > headlines.json
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          feeds = [
              "https://feeds.marketwatch.com/marketwatch/topstories/",
              "https://finance.yahoo.com/news/rssindex",
              "https://www.cnbc.com/id/20910258/device/rss/rss.html",
          ]

          headlines = []
          for url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = resp.read()
                  root = ET.fromstring(data)
                  for item in root.iter("item"):
                      title_el = item.find("title")
                      if title_el is not None and title_el.text:
                          title = title_el.text.strip()
                          if title and title not in headlines:
                              headlines.append(title)
              except Exception:
                  continue

          print(json.dumps(headlines[:10]))
          PY

          echo "headlines<<EOF" >> "$GITHUB_OUTPUT"
          cat headlines.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate brief + reason with GitHub Models
        id: ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SP_PRICE: ${{ steps.sp500.outputs.price }}
          SP_CHANGE: ${{ steps.sp500.outputs.change }}
          SP_DIR: ${{ steps.sp500.outputs.dir }}
          JPM_PRICE: ${{ steps.jpm.outputs.price }}
          JPM_CHANGE: ${{ steps.jpm.outputs.change }}
          JPM_DIR: ${{ steps.jpm.outputs.dir }}
          HEADLINES: ${{ steps.news.outputs.headlines }}
        run: |
          HEADLINES_TEXT=$(echo "$HEADLINES" | jq -r 'if length > 0 then join("; ") else "" end')

          PROMPT="Today the S&P 500 closed at $SP_PRICE, $SP_DIR $SP_CHANGE% from the previous close. JPMorgan (JPM) closed at $JPM_PRICE, $JPM_DIR $JPM_CHANGE%.

          Today's financial news headlines: $HEADLINES_TEXT

          Write:
          1. A one-sentence reason the market moved this way today, grounded in the most relevant headline(s) above. If none of the headlines are clearly relevant, give a brief plausible general explanation instead and don't reference a headline.
          2. A separate one-sentence general daily brief/context line (not about the market).
          Respond in JSON only: {\"reason\": \"...\", \"brief\": \"...\"}"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{
            "messages": [{"role": "user", "content": $prompt}],
            "model": "openai/gpt-4o"
          }')

          set +e
          HTTP_STATUS=$(curl -sS -o /tmp/models-response.json -w "%{http_code}" \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>/tmp/models-curl-error.log)
          CURL_EXIT=$?
          RESPONSE=$(cat /tmp/models-response.json 2>/dev/null)

          RAW_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null)
          CONTENT="{}"
          if [ -n "$RAW_CONTENT" ]; then
            CLEANED=$(echo "$RAW_CONTENT" | sed 's/```json//g; s/```//g')
            PARSED=$(echo "$CLEANED" | jq -c '.' 2>/dev/null)
            if [ -n "$PARSED" ] && [ "$PARSED" != "null" ]; then
              CONTENT="$PARSED"
            fi
          fi

          if [ "$CONTENT" = "{}" ]; then
            echo "::warning::GitHub Models did not return usable content — falling back to placeholder reason/brief"
            echo "::group::GitHub Models debug (curl_exit=$CURL_EXIT http_status=$HTTP_STATUS)"
            echo "--- response body ---"
            echo "$RESPONSE"
            echo "--- curl stderr ---"
            cat /tmp/models-curl-error.log 2>/dev/null
            echo "::endgroup::"
          fi

          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Push to TRMNL
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.MARKET_BRIEF_WEBHOOK_URL }}
          SP_PRICE: ${{ steps.sp500.outputs.price }}
          SP_CHANGE: ${{ steps.sp500.outputs.change }}
          SP_DIR: ${{ steps.sp500.outputs.dir }}
          JPM_PRICE: ${{ steps.jpm.outputs.price }}
          JPM_CHANGE: ${{ steps.jpm.outputs.change }}
          JPM_DIR: ${{ steps.jpm.outputs.dir }}
        run: |
          set +e
          CONTENT='${{ steps.ai.outputs.content }}'
          REASON=$(echo "$CONTENT" | jq -r '.reason // empty' 2>/dev/null)
          BRIEF=$(echo "$CONTENT" | jq -r '.brief // empty' 2>/dev/null)

          if [ -z "$REASON" ]; then
            REASON="Reason unavailable today — check the Action logs."
          fi
          if [ -z "$BRIEF" ]; then
            BRIEF="Daily brief unavailable today."
          fi

          DATE=$(date -u '+%b %d, %Y')

          PAYLOAD=$(jq -n \
            --arg date "$DATE" \
            --arg brief "$BRIEF" \
            --arg sp_price "$SP_PRICE" \
            --arg sp_change "$SP_CHANGE" \
            --arg sp_dir "$SP_DIR" \
            --arg reason "$REASON" \
            --arg jpm_price "$JPM_PRICE" \
            --arg jpm_change "$JPM_CHANGE" \
            --arg jpm_dir "$JPM_DIR" \
            '{merge_variables: {
              date: $date,
              brief: $brief,
              market_index_name: "S&P 500",
              market_price: $sp_price,
              market_change_pct: $sp_change,
              market_direction: $sp_dir,
              market_reason: $reason,
              jpm_price: $jpm_price,
              jpm_change_pct: $jpm_change,
              jpm_direction: $jpm_dir
            }}')

          HTTP_STATUS=$(curl -s -o /tmp/trmnl-response.txt -w "%{http_code}" -X POST "$TRMNL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          cat /tmp/trmnl-response.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::TRMNL webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Done! (HTTP $HTTP_STATUS)"
